<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | Árvore de recados</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f3ede1;--panel:#fffaf0;--ink:#1d2b24;--muted:#5d6b63;--line:#d9cfb8;--pine:#1f5a41;--gold:#e0a526;--btn:#b3242b;--err:#a3141b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b2a;--panel:#17283a;--ink:#f4ecdc;--muted:#a8b4bd;--line:#2c4157;--pine:#2a7a56;--err:#ff8a8f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;line-height:1.5}
.box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.9rem;line-height:1.1;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
form{display:grid;gap:12px}
label{font-weight:600;font-size:.95rem}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 16px;cursor:pointer}
.primary{background:var(--btn);color:#fff}
.primary:disabled{opacity:.6;cursor:wait}
.link{background:none;color:var(--muted);text-decoration:underline;padding:4px;justify-self:start;font-weight:400}
#msg{margin:12px 0 0;min-height:1.4em;font-size:.95rem}
#msg.err{color:var(--err)}
#msg.ok{color:var(--pine)}
@media (prefers-color-scheme:dark){#msg.ok{color:#7be0a8}}
</style>
</head>
<body>
<main class="box">
  <h1>Árvore de recados</h1>
  <p class="sub">Entre para montar a sua árvore e pendurar recados de Natal.</p>
  <div class="tabs">
    <button type="button" id="tIn" aria-pressed="true">Entrar</button>
    <button type="button" id="tUp" aria-pressed="false">Criar conta</button>
  </div>
  <form id="f">
    <label id="nameWrap" hidden>Seu nome
      <input id="name" type="text" maxlength="30" autocomplete="name" placeholder="Como quer assinar os recados">
    </label>
    <label>E-mail
      <input id="email" type="email" required autocomplete="email" placeholder="voce@exemplo.com">
    </label>
    <label>Senha
      <input id="pass" type="password" required minlength="6" autocomplete="current-password" placeholder="Mínimo de 6 caracteres">
    </label>
    <button class="primary" id="go" type="submit">Entrar</button>
    <button class="link" id="forgot" type="button">Esqueci minha senha</button>
  </form>
  <p id="msg" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// 1) Cole aqui os dados do seu projeto (Supabase > Project Settings > API).
//    A chave "anon" é pública por design; a proteção dos dados vem das regras RLS do banco.
var SUPABASE_URL = 'https://lwwznillekwthoqphdch.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_RiQ4av1jFfMAU5mxwHxYUQ_ZzYbhQBh';
// 2) Página para onde a pessoa vai depois de entrar.
var APP_PAGE = 'arvore.html';

var $ = function(id){return document.getElementById(id)};
var signup = false;
var sb = null;

function say(t, kind){var m=$('msg');m.textContent=t;m.className=kind||''}
function mode(up){
  signup = up;
  $('tIn').setAttribute('aria-pressed', String(!up));
  $('tUp').setAttribute('aria-pressed', String(up));
  $('nameWrap').hidden = !up;
  $('name').required = up;
  $('go').textContent = up ? 'Criar conta' : 'Entrar';
  $('pass').autocomplete = up ? 'new-password' : 'current-password';
  $('forgot').hidden = up;
  say('');
}
function translate(e){
  var m = (e && e.message || '').toLowerCase();
  if (m.indexOf('invalid login') > -1) return 'E-mail ou senha incorretos.';
  if (m.indexOf('already registered') > -1) return 'Este e-mail já tem conta. Use a aba Entrar.';
  if (m.indexOf('email not confirmed') > -1) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if (m.indexOf('rate limit') > -1) return 'Muitas tentativas. Aguarde um pouco e tente de novo.';
  if (m.indexOf('password') > -1) return 'A senha precisa ter pelo menos 6 caracteres.';
  return 'Não foi possível concluir. Tente de novo.';
}

if (SUPABASE_URL.indexOf('COLE_AQUI') === 0 || !window.supabase) {
  say('Configure SUPABASE_URL e SUPABASE_ANON_KEY no início do script deste arquivo.', 'err');
  $('go').disabled = true;
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.getSession().then(function(r){ if (r.data && r.data.session) location.replace(APP_PAGE); });
}

$('tIn').addEventListener('click', function(){mode(false)});
$('tUp').addEventListener('click', function(){mode(true)});

$('f').addEventListener('submit', async function(e){
  e.preventDefault();
  if (!sb) return;
  var email = $('email').value.trim(), pass = $('pass').value;
  $('go').disabled = true; say('Aguarde…');
  try {
    var r;
    if (signup) {
      r = await sb.auth.signUp({email: email, password: pass,
        options: {data: {name: $('name').value.trim()}, emailRedirectTo: new URL(APP_PAGE, location.href).href}});
      if (r.error) throw r.error;
      if (r.data.session) { location.replace(APP_PAGE); return; }
      say('Conta criada. Abra o link que enviamos para o seu e-mail para confirmar e depois entre.', 'ok');
    } else {
      r = await sb.auth.signInWithPassword({email: email, password: pass});
      if (r.error) throw r.error;
      location.replace(APP_PAGE);
      return;
    }
  } catch (err) {
    say(translate(err), 'err');
  }
  $('go').disabled = false;
});

$('forgot').addEventListener('click', async function(){
  if (!sb) return;
  var email = $('email').value.trim();
  if (!email) { say('Digite seu e-mail acima e toque de novo em "Esqueci minha senha".', 'err'); return; }
  var r = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.href});
  if (r.error) say(translate(r.error), 'err');
  else say('Se esse e-mail tiver conta, enviamos um link para redefinir a senha.', 'ok');
});
</script>
</body>
</html>
