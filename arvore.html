<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Árvore de recados</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Young+Serif&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f3ede1;--panel:#fffaf0;--ink:#1d2b24;--muted:#5d6b63;--line:#d9cfb8;--gold:#e0a526;--btn:#b3242b;--sky:#e6dcc6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b2a;--panel:#17283a;--ink:#f4ecdc;--muted:#a8b4bd;--line:#2c4157;--sky:#142437}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;line-height:1.5}
header,main{max-width:1140px;margin:0 auto;padding-left:16px;padding-right:16px}
header{padding-top:28px}
main{padding-top:16px;padding-bottom:48px;display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:820px){main{grid-template-columns:1.5fr 1fr;align-items:start}}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:0 0 6px}
.status{color:var(--muted);margin:0 0 12px;font-size:.95rem}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.stage{background:var(--sky);border-radius:20px;padding:12px;border:1px solid var(--line)}
.stage h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.2rem;margin:4px 8px 0}
.tw{position:relative}
svg{display:block;width:100%;height:auto;border-radius:12px}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 8px 2px}
.custom{margin:12px 8px 4px;display:grid;gap:10px}
.orn{cursor:pointer;outline:none}
.orn:hover,.orn:focus-visible{filter:drop-shadow(0 0 6px #ffd76a)}
.orn:focus-visible .ring{stroke:var(--gold);stroke-width:2}
.orn.sel .ring{stroke:#fff;stroke-width:2}
.orn.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
#star{transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){#star,.orn.pop{animation:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
form{display:grid;gap:16px}
legend{font-weight:600;font-size:.95rem}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
fieldset{border:0;padding:0;margin:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label{cursor:pointer;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.opts.wide label{width:auto;padding:0 14px;height:40px;font-weight:600;font-size:.9rem}
.opts input:checked+label{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.opts input:focus-visible+label{outline:3px solid var(--gold);outline-offset:2px}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--btn);color:#fff;padding:12px 16px}
.primary:disabled{opacity:.6;cursor:wait}
.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
/* Carta de Natal */
.letter{position:relative;background:#fffdf5;color:#2a2418;border:1px solid #e6d9b8;border-radius:6px;padding:30px 18px 14px;box-shadow:0 2px 0 #e6d9b8,0 10px 20px rgba(0,0,0,.18)}
.letter::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(135deg,#c8232c 0 12px,#fffdf5 12px 20px,#2f6fd6 20px 32px,#fffdf5 32px 40px)}
.hello{font-family:"Caveat",cursive;font-size:1.7rem;line-height:1.1;margin:0 0 6px;color:#7a1f1f}
textarea.paper{display:block;width:100%;height:200px;min-height:112px;resize:vertical;font-family:"Caveat",cursive;font-size:1.4rem;line-height:28px;color:#2a2418;background:#fffdf5 repeating-linear-gradient(transparent 0 27px,#c8d8ea 27px 28px);background-attachment:local;border:0;border-left:2px solid #e8a0a0;border-radius:0;padding:0 8px;margin:0}
textarea.paper::placeholder{color:#a39877}
.letter .count{text-align:right;font-size:.8rem;color:#7a6a45;margin:2px 0 0}
.sign{display:flex;align-items:baseline;gap:8px;font-family:"Caveat",cursive;font-size:1.5rem;color:#2a2418;margin-top:6px}
.sign input{flex:1;min-width:0;font:inherit;color:#7a1f1f;background:transparent;border:0;border-bottom:1.5px solid #8a7a55;border-radius:0;padding:0 4px;margin:0}
.sign input::placeholder{color:#a39877}
.card{margin-bottom:16px;border-radius:6px;padding:26px 18px 14px;background:#fffdf5;color:#2a2418;border:1px solid #e6d9b8;box-shadow:0 2px 0 #e6d9b8;position:relative}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(135deg,#c8232c 0 12px,#fffdf5 12px 20px,#2f6fd6 20px 32px,#fffdf5 32px 40px)}
.card .to{font-family:"Caveat",cursive;font-size:1.7rem;line-height:1.1;margin:0 0 4px;color:#7a1f1f}
.card .msg{font-family:"Caveat",cursive;font-size:1.5rem;line-height:1.3;margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.card .from{font-family:"Caveat",cursive;font-size:1.5rem;margin:0;color:#7a1f1f;text-align:right}
.card .acts{display:flex;gap:8px;margin-top:12px}
.card .acts button{padding:7px 12px;font-size:.85rem;background:#2a2418;color:#fffdf5}
.empty{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.sr{position:absolute;left:-9999px}
.bulb{animation:blink 1.8s ease-in-out infinite}
.bulb.b1{animation-delay:.6s}
.bulb.b2{animation-delay:1.2s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.bulb{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Pendure um recado na árvore</h1>
  <p class="status" id="status" role="status">Carregando…</p>
  <div class="bar" id="bar"></div>
</header>
<main>
  <section class="stage">
    <h2 id="title">Árvore</h2>
    <div class="tw">
      <svg id="tree" viewBox="0 0 400 520" role="img" aria-label="Árvore de Natal com enfeites">
        <defs>
          <filter id="fShadow" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
          <filter id="fBlur" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
        </defs>
        <g id="sceneg"></g>
        <g id="world">
          <g id="treeg"></g>
          <g id="presg"></g>
          <g id="orns"></g>
        </g>
      </svg>
      <canvas id="snow" aria-hidden="true"></canvas>
    </div>
    <div class="tools"><button type="button" class="ghost" id="snowBtn" aria-pressed="true">Neve: ligada</button></div>
    <div class="custom" id="custom" hidden>
      <fieldset><legend>Modelo da árvore</legend><div class="opts wide" id="styles"></div></fieldset>
      <fieldset><legend>Cor da árvore</legend><div class="opts" id="tcolors"></div></fieldset>
      <fieldset><legend>Cenário</legend><div class="opts wide" id="scenes"></div></fieldset>
      <fieldset><legend>Posição da árvore</legend><div class="opts wide" id="poss"></div></fieldset>
    </div>
  </section>

  <section class="panel" aria-live="polite">
    <p class="empty" id="empty">Toque em um enfeite para ler o recado.</p>
    <div class="card" id="card" hidden>
      <p class="to" id="cTo"></p><p class="msg" id="cMsg"></p><p class="from" id="cFrom"></p>
      <div class="acts"><button type="button" id="copy">Copiar recado</button><button type="button" id="del">Remover enfeite</button></div>
    </div>
    <form id="f" autocomplete="off" hidden>
      <div class="letter">
        <p class="hello" id="hello">Querido(a),</p>
        <textarea id="msg" class="paper" maxlength="500" required placeholder="Escreva aqui o seu recado de Natal…" aria-label="Mensagem"></textarea>
        <p class="count"><span id="cnt">0/500</span></p>
        <label class="sign"><span>Com carinho,</span><input type="text" id="from" maxlength="30" required placeholder="seu nome" aria-label="De quem"></label>
      </div>
      <fieldset><legend>Escolha o enfeite</legend><div class="opts" id="types"></div></fieldset>
      <button class="primary" id="add" type="submit">Pendurar na árvore</button>
      <p id="ferr" role="alert" hidden style="margin:0;color:#e5484d;font-weight:600"></p>
      <button class="ghost" type="button" id="clear">Limpar a árvore</button>
    </form>
  </section>
</main>

  function renderTree(){
    var st=STYLES[treeStyle],base=TREE_COLORS[treeColor][1];
    $('world').setAttribute('transform','translate('+POS[pos]+' 0) translate(200 504) scale(1.05) translate(-200 -504)');
    $('sceneg').innerHTML=SCENES[scene].draw();$('presg').innerHTML=presents();
    if(cv){var hid=scene==='sala'||scene==='fabrica';cv.style.display=hid?'none':'';if(!hid&&cv.width<10)sizeSnow()}
    $('treeg').innerHTML='<ellipse cx="200" cy="500" rx="190" ry="16" fill="#000" opacity=".42" filter="url(#fBlur)"/><g filter="url(#fShadow)"><rect x="175" y="440" width="50" height="50" rx="4" fill="#6b4423"/>'+st.draw(base,shade(base,.22),shade(base,-.28))+'</g>'+decor(st)+
      '<g transform="translate(200 '+(st.top-14)+') scale(.78)"><polygon id="star" points="0,-26 7,-6 28,-6 11,6 17,26 0,14 -17,26 -11,6 -28,-6 -7,-6" fill="#ffe27a" stroke="#b8860b" stroke-width="1.5"/></g>';
    render();
  }

  var NS='http://www.w3.org/2000/svg',layer=$('orns');
  function render(newId){
    layer.innerHTML='';
    items.forEach(function(o){
      var p=fit(o),g=document.createElementNS(NS,'g');
      g.setAttribute('class','orn'+(o.id===sel?' sel':'')+(o.id===newId?' pop':''));
      g.setAttribute('transform','translate('+p.x+' '+p.y+')');
      g.setAttribute('tabindex','0');g.setAttribute('role','button');
      g.setAttribute('aria-label','Recado de '+o.from);
      g.innerHTML='<circle class="ring" r="19" fill="transparent" stroke="none"/>'+shape(TYPES.indexOf(o.type)<0?'bola':o.type);
      g.addEventListener('click',function(){select(o.id)});
      g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();select(o.id)}});
      layer.appendChild(g);
    });
  }
  function select(id){
    sel=id;var o=items.filter(function(i){return i.id===id})[0];
    if(!o){$('card').hidden=true;$('empty').hidden=false;render();return}
    $('cTo').textContent='Querido(a) '+ownerName+',';$('cMsg').textContent=o.msg;$('cFrom').textContent='Com carinho, '+o.from;
    $('del').hidden=!editable;$('card').hidden=false;$('empty').hidden=true;render();
  }
  function place(){
    var st=STYLES[treeStyle],best=null,bd=-1;
    for(var i=0;i<50;i++){
      var y=st.y0+Math.random()*(st.y1-st.y0),h=st.hw(y);
      if(h<8)continue;
      var x=200+(Math.random()*2-1)*h,d=Infinity;
      items.forEach(function(o){var p=fit(o),dd=Math.hypot(p.x-x,p.y-y);if(dd<d)d=dd});
      if(d>=36)return{x:Math.round(x),y:Math.round(y)};
      if(d>bd){bd=d;best={x:Math.round(x),y:Math.round(y)}}
    }
    return best||{x:200,y:300};
  }

  TYPES.forEach(function(t,i){
    $('types').insertAdjacentHTML('beforeend','<input type="radio" name="type" id="t'+i+'" value="'+t+'"'+(i===0?' checked':'')+'><label for="t'+i+'" title="'+t+'"><svg viewBox="-20 -20 40 40" width="32" height="32" aria-hidden="true">'+shape(t)+'</svg><span class="sr">'+t+'</span></label>');
  });
  Object.keys(STYLES).forEach(function(k,i){
    $('styles').insertAdjacentHTML('beforeend','<input type="radio" name="tstyle" id="s'+i+'" value="'+k+'"><label for="s'+i+'">'+STYLES[k].name+'</label>');
  });
  Object.keys(TREE_COLORS).forEach(function(k,i){
    $('tcolors').insertAdjacentHTML('beforeend','<input type="radio" name="tcolor" id="k'+i+'" value="'+k+'"><label for="k'+i+'" title="'+TREE_COLORS[k][0]+'"><span class="sw" style="background:'+TREE_COLORS[k][1]+'"></span><span class="sr">'+TREE_COLORS[k][0]+'</span></label>');
  });
  Object.keys(SCENES).forEach(function(k,i){
    $('scenes').insertAdjacentHTML('beforeend','<input type="radio" name="scene" id="sc'+i+'" value="'+k+'"><label for="sc'+i+'">'+SCENES[k].name+'</label>');
  });
  [['esquerda','Esquerda'],['centro','Centro'],['direita','Direita']].forEach(function(o,i){
    $('poss').insertAdjacentHTML('beforeend','<input type="radio" name="pos" id="po'+i+'" value="'+o[0]+'"><label for="po'+i+'">'+o[1]+'</label>');
  });
  function syncCustom(){
    var a=document.querySelector('input[name=tstyle][value='+treeStyle+']'),b=document.querySelector('input[name=tcolor][value='+treeColor+']');
    var c=document.querySelector('input[name=scene][value="'+scene+'"]');
    var d=document.querySelector('input[name=pos][value="'+pos+'"]');if(a)a.checked=true;if(b)b.checked=true;if(c)c.checked=true;if(d)d.checked=true;
  }
  function saveVisual(){
    if(!editable||!profile||demo)return;
    sb.from('profiles').update({tree_style:treeStyle,tree_color:treeColor,scene:scene,tree_pos:pos}).eq('id',profile.id).then(function(r){
      if(!r.error)return;
      sb.from('profiles').update({tree_style:treeStyle,tree_color:treeColor}).eq('id',profile.id).then(function(r2){
        say(r2.error?'Não foi possível salvar o visual da árvore ('+(r2.error.code||r2.error.message)+').':'O cenário e a posição não foram salvos: rode o supabase-setup.sql novo no Supabase.');
      });
    });
  }
  $('custom').addEventListener('change',function(e){
    if(e.target.name==='tstyle')treeStyle=e.target.value;
    else if(e.target.name==='tcolor')treeColor=e.target.value;
    else if(e.target.name==='scene')scene=e.target.value;
    else if(e.target.name==='pos')pos=e.target.value;
    else return;
    renderTree();saveVisual();
  });
  $('msg').addEventListener('input',function(){$('cnt').textContent=$('msg').value.length+'/500'});

  $('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var p=place(),b=$('add');
    if(demo){
      var d={id:Date.now(),x:p.x,y:p.y,type:document.querySelector('input[name=type]:checked').value,from:$('from').value.trim(),msg:$('msg').value.trim()};
      if(!d.from||!d.msg)return;
      items.push(d);select(d.id);render(d.id);$('msg').value='';$('cnt').textContent='0/500';return;
    }
    b.disabled=true;
    var r=await sb.from('ornaments').insert({owner_id:profile.id,color:'#c8232c',from_name:$('from').value.trim(),message:$('msg').value.trim(),
      type:document.querySelector('input[name=type]:checked').value,x:p.x,y:p.y}).select().single();
    b.disabled=false;
    if(r.error){var fe=$('ferr');var ec=r.error.code||r.error.message||'erro';fe.textContent=ec==='23514'?'O banco ainda não aceita este enfeite. Rode o supabase-setup.sql novo no Supabase (código 23514).':ec==='23502'?'O banco ainda está desatualizado. Rode o supabase-setup.sql novo no Supabase (código 23502).':'Não foi possível pendurar o enfeite agora ('+ec+'). Tente de novo.';fe.hidden=false;return}
    $('ferr').hidden=true;
    var o=fromRow(r.data);items.push(o);select(o.id);render(o.id);
    $('msg').value='';$('cnt').textContent='0/500';say('');
  });
  $('del').addEventListener('click',async function(){
    if(!editable||!sel)return;
    if(demo){items=items.filter(function(i){return i.id!==sel});select(null);return}
    var r=await sb.from('ornaments').delete().eq('id',sel);
    if(r.error){say('Não foi possível remover agora.');return}
    items=items.filter(function(i){return i.id!==sel});select(null);
  });
  $('clear').addEventListener('click',async function(){
    if(!editable||!items.length||!confirm('Remover todos os enfeites da sua árvore?'))return;
    if(demo){items=[];select(null);return}
    var r=await sb.from('ornaments').delete().eq('owner_id',profile.id);
    if(r.error){say('Não foi possível limpar agora.');return}
    items=[];select(null);
  });
  $('copy').addEventListener('click',function(){
    var o=items.filter(function(i){return i.id===sel})[0];if(!o)return;var b=this;
    try{navigator.clipboard.writeText(o.msg+' — '+o.from).then(function(){b.textContent='Copiado!';setTimeout(function(){b.textContent='Copiar recado'},1500)},function(){})}catch(e){}
  });

  function btn(txt,fn,href){
    var el=document.createElement(href?'a':'button');el.className='btn ghost';el.textContent=txt;
    if(href)el.href=href;else{el.type='button';el.addEventListener('click',fn)}
    $('bar').appendChild(el);return el;
  }
  async function boot(){
    var slug=new URLSearchParams(location.search).get('u');
    var s=await sb.auth.getSession();me=s.data.session&&s.data.session.user;
    var q=sb.from('profiles').select('*');
    if(slug)q=q.eq('slug',slug);
    else{if(!me){location.replace('login.html');return}q=q.eq('id',me.id)}
    var r=await q.maybeSingle();
    if(r.error||!r.data){say((slug?'Não encontramos essa árvore. Confira o link.':'Não foi possível carregar seu perfil. Saia e entre de novo.')+(r.error?' Detalhe: '+(r.error.code||'')+' '+(r.error.message||''):''));
      if(me)btn('Sair',signOut);else btn('Entrar','', 'login.html');return}
    demo=false;profile=r.data;ownerName=profile.name;editable=!!me&&me.id===profile.id;
    if(STYLES[profile.tree_style])treeStyle=profile.tree_style;
    if(TREE_COLORS[profile.tree_color])treeColor=profile.tree_color;
    if(SCENES[profile.scene])scene=profile.scene;
    if(POS[profile.tree_pos]!==undefined)pos=profile.tree_pos;
    $('f').hidden=false;$('clear').hidden=!editable;$('hello').textContent='Querido(a) '+ownerName+',';
    var o=await sb.from('ornaments').select('*').eq('owner_id',profile.id).order('created_at');
    if(o.error){say('Não foi possível carregar os enfeites agora. Detalhe: '+(o.error.code||'')+' '+(o.error.message||''));return}
    items=o.data.map(fromRow);
    if(editable){
      $('title').textContent='Minha árvore';$('from').value=profile.name;$('custom').hidden=false;syncCustom();
      say('Você entrou como '+profile.name+'. Compartilhe o link para as pessoas pendurarem recados na sua árvore.');
      btn('Copiar link da minha árvore',function(){
        var url=location.origin+location.pathname+'?u='+profile.slug,b=this;
        try{navigator.clipboard.writeText(url).then(function(){b.textContent='Link copiado!';setTimeout(function(){b.textContent='Copiar link da minha árvore'},1800)},function(){})}catch(e){}
      });
      btn('Sair',signOut);
    }else{
      $('title').textContent='Árvore de '+profile.name;say('Árvore de '+profile.name+'. Escolha um enfeite, escreva seu recado e pendure na árvore.');
      if(me){var mp=await sb.from('profiles').select('name').eq('id',me.id).maybeSingle();if(mp.data)$('from').value=mp.data.name}
      if(me)btn('Ir para minha árvore','',location.pathname);else btn('Entrar para criar a minha','', 'login.html');
    }
    renderTree();select(null);
  }
  function startDemo(why){
    demo=true;editable=true;ownerName='amigo(a)';profile={id:'demo',name:'Você'};
    items=[{id:1,x:200,y:150,type:'estrela',from:'Ana',msg:'Feliz Natal! Que a sua casa se encha de luz.'},
      {id:2,x:165,y:250,type:'biscoito',from:'Bia',msg:'Separei um biscoito de gengibre só para você.'},
      {id:3,x:238,y:290,type:'rena',from:'Caio',msg:'A rena já está pronta para a noite de Natal!'},
      {id:4,x:190,y:355,type:'quebra-nozes',from:'Duda',msg:'Que o ano novo seja doce e cheio de alegria.'},
      {id:5,x:130,y:395,type:'presente',from:'Edu',msg:'Seu presente é o meu abraço apertado.'},
      {id:6,x:262,y:400,type:'sino',from:'Fê',msg:'Ouço os sinos... é Natal!'}];
    $('f').hidden=false;$('clear').hidden=false;$('custom').hidden=false;
    $('title').textContent='Minha árvore (demonstração)';$('hello').textContent='Querido(a) amigo(a),';$('from').value='';
    syncCustom();renderTree();select(null);$('bar').innerHTML='';
    say(why||'Modo demonstração: nada é salvo. No site publicado, a árvore fica salva na sua conta.');
  }
  async function signOut(){await sb.auth.signOut();location.replace('login.html')}

  var cv=$('snow'),cx=cv.getContext('2d'),flakes=[],snowOn=!matchMedia('(prefers-reduced-motion: reduce)').matches,raf=0;
  function sizeSnow(){
    var r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;flakes=[];
    for(var i=0;i<Math.round(r.width/9);i++)flakes.push({x:Math.random()*r.width,y:Math.random()*r.height,r:1+Math.random()*2.2,v:.3+Math.random()*.8,d:Math.random()*6});
  }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);if(!snowOn)return;
    cx.fillStyle='#fff';cx.strokeStyle='rgba(60,90,120,.35)';
    flakes.forEach(function(f){f.y+=f.v;f.d+=.02;f.x+=Math.sin(f.d)*.4;if(f.y>cv.height){f.y=-4;f.x=Math.random()*cv.width}cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill();cx.stroke()});
    raf=requestAnimationFrame(tick);
  }
  function setSnow(on){snowOn=on;$('snowBtn').textContent='Neve: '+(on?'ligada':'desligada');$('snowBtn').setAttribute('aria-pressed',String(on));cancelAnimationFrame(raf);tick()}
  $('snowBtn').addEventListener('click',function(){setSnow(!snowOn)});
  window.addEventListener('resize',sizeSnow);sizeSnow();setSnow(snowOn);
  renderTree();

  if(SUPABASE_URL.indexOf('COLE_AQUI')===0||!window.supabase){startDemo();return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  var done=false,timer=setTimeout(function(){if(!done)startDemo('Modo demonstração: não foi possível conectar ao servidor, então nada será salvo.')},5000);
  boot().then(function(){done=true;clearTimeout(timer)}).catch(function(e){done=true;clearTimeout(timer);startDemo('Modo demonstração: não foi possível conectar ao servidor ('+((e&&e.message)||e)+'). Nada será salvo.')});
})();
</script>
</body>
</html>
